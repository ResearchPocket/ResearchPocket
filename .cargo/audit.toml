[advisories]
# Loro's locked postcard metadata includes heapless 0.7's optional
# atomic-polyfill dependency, but no supported ResearchPocket target or enabled
# feature builds it (`cargo tree -i atomic-polyfill` is empty). Keep this narrow
# exception until Loro's lock graph drops that unmaintained optional package.
ignore = [
  "RUSTSEC-2023-0089",
  # Loro 1.13.7 uses im::HashMap and im::HashSet, not the OrdSet insertion
  # affected by RUSTSEC-2023-0126. Upstream still carries im 15.1.0 as of
  # Loro 1.14.1. Issue #170 tracks replacing this pinned dependency and
  # removing all four exceptions below.
  "RUSTSEC-2023-0126",
  "RUSTSEC-2026-0247",
  "RUSTSEC-2026-0248",
  "RUSTSEC-2026-0251",
]
